##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}


# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


windowrule {
  name = windowrule-3
  float = on
  center = on
  size = 1200 700 pin
  match:class = (menus)
}


# Picture-in-picture overlays 
windowrule {
  name = windowrule-4
  tag = +pip
  match:title = (Picture.?in.?[Pp]icture)
}

windowrule {
  name = windowrule-5
  float = on
  pin = on
  keep_aspect_ratio = on
  opacity = 1 1
  move = (40) ((monitor_h*1)-h-40)
  border_size = 2
  border_color = rgb(f6c177)
  rounding = 10
  match:tag = pip
}





windowrule {
  name = windowrule-6
  float = on
  pin = on
  size = 300 360
  center = on
  rounding = 10
  match:class = ^(algo)$
}


#wlogout
layerrule {
  name = layerrule-1
  dim_around = on
  blur = on
  match:namespace = logout_dialog
}

windowrule {
  name = geometrydash
  # float = on
  center = on
  # fullscreen = on
  # maximize = on
  match:class = ^(steam_app_322170)$
}

